<!DOCTYPE html>
<html>
<head>
    <title>Test Seller Analytics</title>
</head>
<body>
    <h1>Testing Seller Analytics</h1>
    <div id="results"></div>
    
    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            try {
                // First login
                results.innerHTML += '<p>🔍 Logging in...</p>';
                
                const loginResponse = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'seller1@gmail.com',
                        password: '12345678'
                    })
                });
                
                const loginData = await loginResponse.json();
                if (!loginResponse.ok) {
                    throw new Error('Login failed: ' + JSON.stringify(loginData));
                }
                
                results.innerHTML += '<p>✅ Login successful</p>';
                const token = loginData.token;
                
                // Test stats
                results.innerHTML += '<p>📊 Fetching seller stats...</p>';
                const statsResponse = await fetch('http://localhost:3001/api/seller/stats', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const statsData = await statsResponse.json();
                if (!statsResponse.ok) {
                    throw new Error('Stats failed: ' + JSON.stringify(statsData));
                }
                
                results.innerHTML += '<h3>📊 Stats Response:</h3>';
                results.innerHTML += '<pre>' + JSON.stringify(statsData, null, 2) + '</pre>';
                
                // Test analytics
                results.innerHTML += '<p>📈 Fetching seller analytics...</p>';
                const analyticsResponse = await fetch('http://localhost:3001/api/seller/analytics', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const analyticsData = await analyticsResponse.json();
                if (!analyticsResponse.ok) {
                    throw new Error('Analytics failed: ' + JSON.stringify(analyticsData));
                }
                
                results.innerHTML += '<h3>📈 Analytics Response:</h3>';
                results.innerHTML += '<pre>' + JSON.stringify(analyticsData, null, 2) + '</pre>';
                
            } catch (error) {
                results.innerHTML += '<p style="color: red;">❌ Error: ' + error.message + '</p>';
                console.error('Error:', error);
            }
        }
        
        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
